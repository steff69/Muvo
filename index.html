<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voaki &amp; Mustafaki Universe ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --cosmic-bg: #07030e;
  --accent-pink: #ff5c8a;
  --accent-glow: #ffc9e6;
}

*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:"Outfit",sans-serif;color:#fdeef8;
  background:
    radial-gradient(circle at 50% 50%, rgba(90, 30, 110, 0.45), transparent 70%),
    radial-gradient(circle at 20% 80%, rgba(20, 50, 120, 0.4), transparent 60%),
    linear-gradient(180deg, #10051d, #040208);
  background-attachment:fixed;overflow-x:hidden;
}

/* Header & Counters */
.header-container {
  position: relative;
  z-index: 10;
  text-align: center;
  padding-top: 36px;
  pointer-events: none;
}
.eyebrow{margin:0;text-align:center;font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:#c9a6d8}
h1{
  margin:12px 0 0;text-align:center;font-family:"Fraunces",serif;font-style:italic;font-weight:600;
  font-size:clamp(34px,6vw,58px);
  background:linear-gradient(100deg,#ffc9e6,#e0a8ff,#a8e0ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter: drop-shadow(0 0 15px rgba(224,168,255,0.3));
}
.names{margin:10px 0 0;text-align:center;font-family:"Fraunces",serif;font-size:clamp(18px,3.5vw,24px)}
.names span{color:var(--accent-pink); animation: pulseHeart 1.5s infinite alternate ease-in-out; display:inline-block;}
@keyframes pulseHeart { from{transform:scale(0.9);} to{transform:scale(1.2);} }

.sub{margin:8px 0 0;text-align:center;font-size:13px;color:#c9a6d8}
.counter{
  display:inline-block;margin:18px auto 0;padding:6px 18px;border-radius:999px;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
  font-size:12px;color:#c9a6d8;backdrop-filter:blur(8px);pointer-events:auto;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.counter b{color:var(--accent-pink)}

/* Music Player Controls */
.music-controls {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: rgba(38, 16, 56, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  cursor: pointer;
}
.music-btn {
  background: none;
  border: none;
  color: #ffc9e6;
  font-size: 18px;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.music-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: #c9a6d8;
  text-transform: uppercase;
  user-select: none;
}

/* Cosmic Canvas Setup */
.universe-stage {
  position: relative;
  width: 100vw;
  height: 680px;
  max-width: 1200px;
  margin: 220px auto 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.center-sun {
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffffff, #ff7bb0 40%, #d946ef 85%);
  box-shadow: 0 0 50px #ff5c8a, 0 0 100px rgba(217, 70, 239, 0.6);
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  animation: sunGlow 4s infinite alternate ease-in-out;
}
@keyframes sunGlow {
  from { box-shadow: 0 0 40px #ff5c8a, 0 0 80px rgba(217, 70, 239, 0.5); transform: scale(0.98); }
  to { box-shadow: 0 0 65px #ff8ab3, 0 0 130px rgba(217, 70, 239, 0.8); transform: scale(1.04); }
}

/* Orbit Lines */
.orbit-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px dashed rgba(255, 255, 255, 0.15);
  pointer-events: none;
}

/* Interactive Planets */
.orbit-track {
  position: absolute;
  border-radius: 50%;
  animation: spinOrbit linear infinite;
  pointer-events: none;
}
.orbit-track:hover { animation-play-state: paused; }

@keyframes spinOrbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.planet {
  position: absolute;
  border: 0; background: none; padding: 0; cursor: pointer;
  transform: translate(-50%, -50%);
  outline: none;
  pointer-events: auto;
}

.planet .halo {
  position: absolute; inset: -8px; border-radius: 50%;
  filter: blur(14px); opacity: 0.6; transition: opacity .3s, transform .3s;
  pointer-events: none;
}
.planet .ball {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.planet-content {
  display: flex; flex-direction: column; align-items: center;
}

.planet:hover .ball, .planet:focus-visible .ball {
  transform: scale(1.25);
  border-color: #fff;
}
.planet:hover .halo { opacity: 1; transform: scale(1.3); }

.planet .name {
  position: absolute;
  top: 105%;
  white-space: nowrap;
  font-size: 11px; letter-spacing: .15em; text-transform: uppercase;
  color: #e2c2f0; opacity: 0.85; transition: .3s;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9);
  pointer-events: none;
}
.planet:hover .name { opacity: 1; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
.planet .tick { position: absolute; top: -6px; right: -6px; font-size: 14px; text-shadow: 0 0 6px #fff; }

/* Background Canvas Layers */
.layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}
.heart{position:absolute;bottom:-40px;animation:fly linear infinite}
@keyframes fly{
  from{transform:translateY(10vh) scale(.7) rotate(-8deg);opacity:0}
  12%{opacity:.85}
  to{transform:translateY(-105vh) scale(1.15) rotate(10deg);opacity:0}
}

/* Modal Window */
.overlay{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(7, 3, 14, 0.75);backdrop-filter:blur(12px);
}
.overlay.show{display:flex}
.box{
  width:100%;max-width:440px;padding:40px 32px;text-align:center;border-radius:32px;
  border:1px solid rgba(255,255,255,.18);background:linear-gradient(145deg, rgba(42, 18, 62, 0.95), rgba(20, 8, 32, 0.98));
  box-shadow:0 0 80px rgba(239, 68, 163, 0.35);animation:pop .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.box .icon{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 10px 25px rgba(0,0,0,0.3)}
.box h2{margin:0;font-family:"Fraunces",serif;font-style:italic;font-size:28px;color:#ffc9e6}
.box p{margin:14px 0 0;font-size:15px;line-height:1.7;color:rgba(253,238,248,.9)}
.box button{
  margin-top:28px;padding:14px 32px;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(90deg, #ff4d84, #d946ef);color:#fff;font-family:inherit;font-size:14px;font-weight:600;
  box-shadow:0 0 30px rgba(255,77,132,.4);transition:transform .2s, box-shadow .2s;
}
.box button:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(255,77,132,.7);}

footer{position:relative;z-index:10;padding:40px 0 32px;margin-top:150px;text-align:center;font-size:12px;color:#c9a6d8}
</style>
</head>
<body>

<div class="header-container">
  <p class="eyebrow">Est. one starry night</p>
  <h1>Our Little Universe</h1>
  <p class="names">Vo <span>✦</span> Mustafaki</p>
  <p class="sub">Two souls, one synchronized cosmos — select an orbiting world.</p>
  <p class="counter"><b id="count">0</b><span id="total"></span> planets visited<span id="secretNote"></span></p>
</div>

<!-- Background Music Player Widget -->
<div class="music-controls" id="musicWrapper">
  <button class="music-btn" id="musicToggle" aria-label="Play Music">🎵</button>
  <span class="music-label" id="musicStatus">Play Melody</span>
</div>

<!-- Reverted back to original working track -->
<audio id="bgMusic" loop preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112188.mp3" type="audio/mpeg">
</audio>

<div class="layer" id="stars"></div>
<div class="layer" id="hearts"></div>

<!-- System Stage -->
<main class="universe-stage" id="universeStage">
  <div class="center-sun">💖</div>
</main>

<!-- Dialog Box -->
<div class="overlay" id="overlay">
  <div class="box">
    <div class="icon" id="boxIcon"></div>
    <h2 id="boxTitle"></h2>
    <div id="boxText"></div>
    <button onclick="closeBox()">Return to Universe ✨</button>
  </div>
</div>

<footer>made with 💖 in Attiki</footer>

<script>
const PLANETS = [
  {id:"heart", emoji:"❤️", name:"Love", color:"#ff3f6d", size:56, orbitRadius: 110, speed: 28,
   lines:["Of all the orbits in all the skies, mine keeps bending back to you.","You are my gravity, Vo. — Mustafaki"]},
  {id:"memory", emoji:"⭐", name:"Memories", color:"#ffc857", size:48, orbitRadius: 155, speed: 36,
   lines:["Every laugh we stole became a star up here.","That first late-night call still burns the brightest."]},
  {id:"future", emoji:"🌎", name:"Future", color:"#3ec5ff", size:58, orbitRadius: 200, speed: 44,
   lines:["A small kitchen, loud music, slow mornings.","Wherever we land — we build the whole world there."]},
  {id:"moon", emoji:"🌙", name:"Our Moon", color:"#e6e6f0", size:50, orbitRadius: 245, speed: 52,
   lines:["Same moon, two windows, one heart.","Look up tonight — I'll be looking too."]},
  {id:"weed", emoji:"🌿", name:"Weed", color:"#10b981", size:48, orbitRadius: 290, speed: 60,
   lines:["High above the clouds, high on each other. 💨🌿","Getting high, laughing at nothing, floating through the universe with you."]},
  {id:"dream", emoji:"🌠", name:"Dreams", color:"#6f7bff", size:52, orbitRadius: 335, speed: 68,
   lines:["I keep meeting you in places we haven't been yet.","Sleep well — I'll save you a seat in mine."]},
  {id:"adventure", emoji:"🚀", name:"Adventure", color:"#ff8a3d", size:46, orbitRadius: 380, speed: 76,
   lines:["Pick a coordinate, any coordinate — I'm already packed.","The map only makes sense with two names on it."]},
  {id:"home", emoji:"🏡", name:"Home", color:"#57c98a", size:52, orbitRadius: 425, speed: 84,
   lines:["Home was never a place. It was the sound of you arriving.","Door's always open on this one."]},
  {id:"forever", emoji:"💫", name:"Forever", color:"#c77dff", size:54, orbitRadius: 470, speed: 92,
   lines:["Stars burn out. This doesn't.","However long forever is — add one more day."]},
  {id:"stars", emoji:"✨", name:"Stardust", color:"#ffe08a", size:42, orbitRadius: 510, speed: 100,
   lines:["We're made of the same leftover light.","Every wish I threw up here had your name on it."]},
  {id:"secret", emoji:"💖", name:"Secret World", color:"#ff6fae", size:62, orbitRadius: 550, speed: 110, secret:true,
   lines:["The hidden planet only you could reach.","Forever, in every universe. Yours — Mustafaki."]}
];

const TOTAL = PLANETS.filter(p => !p.secret).length;
const visited = new Set();
document.getElementById("total").textContent = "/" + TOTAL;

/* Starfield generator */
const starLayer = document.getElementById("stars");
for (let i = 0; i < 140; i++) {
  const s = document.createElement("span");
  s.className = "star";
  const size = 1 + Math.random() * 2.5;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${Math.random()*3}s`;
  starLayer.appendChild(s);
}

/* Floating heart particle system */
const glyphs = ["💖","💫","❤️","✨","💕","🌟"];
const heartLayer = document.getElementById("hearts");
for (let i = 0; i < 18; i++) {
  const h = document.createElement("span");
  h.className = "heart";
  h.textContent = glyphs[i % glyphs.length];
  h.style.cssText = `left:${Math.random()*96}%;font-size:${16+Math.random()*14}px;animation-duration:${8+Math.random()*6}s;animation-delay:${Math.random()*10}s`;
  heartLayer.appendChild(h);
}

/* Audio Player Logic */
const audio = document.getElementById("bgMusic");
const musicWrapper = document.getElementById("musicWrapper");
const musicBtn = document.getElementById("musicToggle");
const musicStatus = document.getElementById("musicStatus");

function playAudio() {
  audio.play().then(() => {
    musicBtn.textContent = "⏸️";
    musicStatus.textContent = "Playing";
  }).catch(err => console.log("User click required for audio:", err));
}

function toggleMusic(e) {
  if (e) e.stopPropagation();
  if (audio.paused) {
    playAudio();
  } else {
    audio.pause();
    musicBtn.textContent = "🎵";
    musicStatus.textContent = "Paused";
  }
}

musicWrapper.addEventListener("click", toggleMusic);

// Auto-start music on first interaction anywhere on page
document.addEventListener('click', function autoPlayFirstClick() {
  if (audio.paused) {
    playAudio();
  }
}, { once: true });

/* Constructing Orbital System */
const stage = document.getElementById("universeStage");

function buildUniverse() {
  const existingTracks = stage.querySelectorAll('.orbit-ring, .orbit-track');
  existingTracks.forEach(el => el.remove());

  PLANETS.forEach((p, i) => {
    if (p.secret && visited.size < TOTAL) return;

    const responsiveRadius = Math.min(p.orbitRadius, window.innerWidth * 0.44);

    // Orbit Path ring
    const ring = document.createElement("div");
    ring.className = "orbit-ring";
    ring.style.width = (responsiveRadius * 2) + "px";
    ring.style.height = (responsiveRadius * 2) + "px";
    stage.appendChild(ring);

    // Rotating Track
    const track = document.createElement("div");
    track.className = "orbit-track";
    track.style.width = (responsiveRadius * 2) + "px";
    track.style.height = (responsiveRadius * 2) + "px";
    track.style.animationDuration = p.speed + "s";
    
    // Planet button
    const btn = document.createElement("button");
    btn.className = "planet";
    btn.id = "planet-" + p.id;
    btn.setAttribute("aria-label", p.name);
    btn.style.left = "50%";
    btn.style.top = "0%";
    
    btn.innerHTML = `
      <span class="halo" style="background:${p.color}"></span>
      <div class="planet-content">
        <span class="ball" style="width:${p.size}px;height:${p.size}px;background:radial-gradient(circle at 30% 30%, #ffffff, ${p.color} 65%, #000000)">${p.emoji}</span>
        <span class="name">${p.name}</span>
      </div>
      <span class="tick-mark">${visited.has(p.id) ? '<span class="tick">✧</span>' : ''}</span>`;
    
    btn.onclick = (e) => {
      e.stopPropagation();
      openBox(p);
    };

    track.appendChild(btn);
    stage.appendChild(track);
  });
}

function openBox(p) {
  visited.add(p.id);
  document.getElementById("count").textContent = [...visited].filter(id => id !== "secret").length;
  document.getElementById("secretNote").textContent = visited.size >= TOTAL ? " · secret unlocked 💖" : "";
  document.getElementById("boxIcon").textContent = p.emoji;
  document.getElementById("boxIcon").style.background = p.color;
  document.getElementById("boxTitle").textContent = p.name;
  document.getElementById("boxText").innerHTML = p.lines.map(l => `<p>${l}</p>`).join("");
  document.getElementById("overlay").classList.add("show");
  
  // Add checkmark without resetting universe rotation
  const btn = document.getElementById("planet-" + p.id);
  if (btn) {
    const tickContainer = btn.querySelector('.tick-mark');
    if (tickContainer && !tickContainer.innerHTML) {
      tickContainer.innerHTML = '<span class="tick">✧</span>';
    }
  }

  // Check if secret planet should spawn
  if (visited.size >= TOTAL && !document.getElementById("planet-secret")) {
    buildUniverse();
  }
}

function closeBox() {
  document.getElementById("overlay").classList.remove("show");
}

document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") closeBox();
});
document.addEventListener("keydown", e => e.key === "Escape" && closeBox());

window.addEventListener('resize', buildUniverse);
buildUniverse();
</script>
</body>
</html>
