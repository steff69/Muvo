<!DOCTYPE html>
<html>
<head>
<title>Vo & Mustafaki Universe ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:"Trebuchet MS", sans-serif;
    background:radial-gradient(circle at top,#32104f,#000);
    color:white;
}


/* TITLE */

.title{
    position:absolute;
    top:25px;
    width:100%;
    text-align:center;
    font-size:35px;
    color:#ffb6e6;
    text-shadow:0 0 25px pink;
    animation:pulse 2s infinite;
}


.names{
    position:absolute;
    top:85px;
    width:100%;
    text-align:center;
    color:#ffd6f5;
    font-size:22px;
    text-shadow:0 0 15px pink;
}


.names small{
    font-size:16px;
}


@keyframes pulse{
    50%{
        transform:scale(1.05);
    }
}



/* STARS */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}


@keyframes twinkle{

from{
opacity:.2;
}

to{
opacity:1;
}

}



/* WORLD */

.planet{

    position:absolute;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    transition:.5s;

}


.planet:hover{

    transform:scale(1.25);
    filter:drop-shadow(0 0 25px white);

}



/* PLANETS */


.heartPlanet{

width:110px;
height:110px;
background:#ff3366;
left:15%;
top:45%;

}



.memoryPlanet{

width:90px;
height:90px;
background:#ffc857;
right:25%;
top:35%;

}



.futurePlanet{

width:130px;
height:130px;
background:#3ec5ff;
left:45%;
bottom:15%;

}



.moon{

width:130px;
height:130px;
background:#eee;
color:#555;
right:10%;
bottom:25%;

}



.secret{

width:100px;
height:100px;
background:#d946ef;
left:45%;
top:20%;
display:none;

}




/* MESSAGE BOX */


.box{

position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) scale(0);

width:360px;
padding:30px;
background:white;
color:#ff3366;
border-radius:30px;
text-align:center;
box-shadow:0 0 50px pink;
transition:.5s;
z-index:5;

}


.box.show{

transform:translate(-50%,-50%) scale(1);

}


button{

padding:12px 25px;
border:0;
border-radius:25px;
background:#ff3366;
color:white;
cursor:pointer;

}



/* FLOATING HEARTS */


.heart{

position:absolute;
font-size:25px;
animation:fly 8s linear infinite;

}


@keyframes fly{

from{
transform:translateY(100vh);
opacity:1;
}

to{
transform:translateY(-20vh);
opacity:0;
}

}



</style>

</head>


<body>


<div class="title">
🌌 Our Little Universe ❤️
</div>


<div class="names">
💖 Vo + Mustafaki 💖
<br>
<small>Two souls, one universe ✨</small>
</div>




<!-- PLANETS -->


<div class="planet heartPlanet" onclick="
openBox(
'❤️ Vo & Mustafaki',
'This is where our story lives. Every conversation, every laugh, and every beautiful moment created our universe.'
)">
❤️
</div>



<div class="planet memoryPlanet" onclick="
openBox(
'⭐ Our Memories',
'All the jokes, late talks, smiles, and moments that only we understand.'
)">
⭐
</div>




<div class="planet futurePlanet" onclick="
openBox(
'🌎 Our Dreams',
'The places we want to visit, the dreams we want to achieve, and the future we imagine together.'
)">
🌎
</div>




<div class="planet moon" onclick="
openBox(
'🌙 My Promise',
'Vo, no matter where life takes us, you will always have your own place in my universe ❤️'
)">
🌙
</div>



<div class="planet secret" id="secret" onclick="
openBox(
'💖 The Final Secret',
'Vo, you are my favorite place in this entire universe. ❤️ — Mustafaki'
)">
💖
</div>





<div class="box" id="box">

<h2 id="boxTitle"></h2>

<p id="boxText"></p>

<button onclick="closeBox()">
Return to Universe ✨
</button>

</div>




<script>


let found=0;


// open message

function openBox(title,text){

document.getElementById("boxTitle").innerHTML=title;

document.getElementById("boxText").innerHTML=text;

document.getElementById("box").classList.add("show");



found++;

if(found>=4){

document.getElementById("secret").style.display="flex";

}

}



function closeBox(){

document.getElementById("box").classList.remove("show");

}




// stars

for(let i=0;i<150;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*100+"%";

star.style.animationDelay=Math.random()*3+"s";

document.body.appendChild(star);

}



// hearts

setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"%";

heart.style.animationDuration=
(5+Math.random()*5)+"s";


document.body.appendChild(heart);


setTimeout(()=>{

heart.remove();

},9000);


},700);



</script>


</body>
</html>
