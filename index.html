<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vo &amp; Mustafaki Universe ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:"Outfit",sans-serif;color:#fdeef8;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(150,60,190,.55), transparent 60%),
    radial-gradient(90% 70% at 15% 110%, rgba(50,80,190,.45), transparent 65%),
    linear-gradient(180deg,#1d0a2e,#08040f);
  background-attachment:fixed;overflow-x:hidden
}
.eyebrow{margin:48px 0 0;text-align:center;font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:#c9a6d8}
h1{
  margin:16px 0 0;text-align:center;font-family:"Fraunces",serif;font-style:italic;font-weight:600;
  font-size:clamp(34px,7vw,64px);
  background:linear-gradient(100deg,#ffc9e6,#e0a8ff,#a8e0ff);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.names{margin:14px 0 0;text-align:center;font-family:"Fraunces",serif;font-size:clamp(18px,4vw,26px)}
.names span{color:#ff5c8a}
.sub{margin:8px 0 0;text-align:center;font-size:14px;color:#c9a6d8}
.counter{
  display:block;width:max-content;margin:24px auto 0;padding:6px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
  font-size:12px;color:#c9a6d8;backdrop-filter:blur(6px)
}
.counter b{color:#ff5c8a}

/* stars + hearts */
.layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}
.heart{position:absolute;bottom:-40px;animation:fly linear infinite}
@keyframes fly{
  from{transform:translateY(10vh) scale(.7) rotate(-8deg);opacity:0}
  12%{opacity:.9}
  to{transform:translateY(-105vh) scale(1.15) rotate(10deg);opacity:0}
}

/* planets */
.space{
  position:relative;z-index:1;max-width:1000px;margin:48px auto 0;padding:0 24px 80px;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:48px 32px
}
.planet{
  position:relative;border:0;background:none;padding:0;cursor:pointer;
  animation:drift 9s ease-in-out infinite alternate
}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-18px)}}
.planet .halo{position:absolute;inset:0;border-radius:50%;filter:blur(28px);animation:halo 4s ease-in-out infinite;z-index:-1}
@keyframes halo{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.12)}}
.planet .ball{
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);font-size:38px;
  box-shadow:0 25px 50px rgba(0,0,0,.45);transition:transform .5s
}
.planet:hover .ball,.planet:focus-visible .ball{transform:scale(1.15)}
.planet .name{
  display:block;margin-top:12px;text-align:center;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:#c9a6d8;opacity:0;transition:.3s
}
.planet:hover .name,.planet:focus-visible .name{opacity:1}
.planet .tick{position:absolute;top:-4px;right:-4px;font-size:14px}

/* modal */
.overlay{
  position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;
  background:rgba(10,4,18,.7);backdrop-filter:blur(8px)
}
.overlay.show{display:flex}
.box{
  width:100%;max-width:420px;padding:36px;text-align:center;border-radius:32px;
  border:1px solid rgba(255,255,255,.14);background:rgba(38,16,56,.95);
  box-shadow:0 0 90px rgba(255,110,180,.45);animation:pop .35s ease-out
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.box .icon{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
.box h2{margin:0;font-family:"Fraunces",serif;font-style:italic;font-size:26px;color:#ffc9e6}
.box p{margin:14px 0 0;font-size:14px;line-height:1.7;color:rgba(253,238,248,.85)}
.box button{
  margin-top:26px;padding:13px 28px;border:0;border-radius:999px;cursor:pointer;
  background:#ff4d84;color:#fff;font-family:inherit;font-size:14px;font-weight:600;
  box-shadow:0 0 40px rgba(255,77,132,.5);transition:transform .2s
}
.box button:hover{transform:scale(1.06)}
footer{position:relative;z-index:1;padding:0 0 32px;text-align:center;font-size:12px;color:#c9a6d8}
</style>
</head>
<body>

<p class="eyebrow">Est. one starry night</p>
<h1>Our Little Universe</h1>
<p class="names">Vo <span>✦</span> Mustafaki</p>
<p class="sub">Two souls, one universe — tap a planet to hear it speak.</p>
<p class="counter"><b id="count">0</b><span id="total"></span> planets visited<span id="secretNote"></span></p>

<div class="layer" id="stars"></div>
<div class="layer" id="hearts"></div>

<section class="space" id="space"></section>

<div class="overlay" id="overlay">
  <div class="box">
    <div class="icon" id="boxIcon"></div>
    <h2 id="boxTitle"></h2>
    <div id="boxText"></div>
    <button onclick="closeBox()">Return to Universe ✨</button>
  </div>
</div>

<footer>made with 💖 in a corner of the galaxy</footer>

<script>
const PLANETS = [
  {id:"heart", emoji:"❤️", name:"Planet Love", color:"#ff3f6d", size:128,
   lines:["Of all the orbits in all the skies, mine keeps bending back to you.","You are my gravity, Vo. — Mustafaki"]},
  {id:"memory", emoji:"⭐", name:"Planet Memories", color:"#ffc857", size:104,
   lines:["Every laugh we stole became a star up here.","That first late-night call still burns the brightest."]},
  {id:"future", emoji:"🌎", name:"Planet Future", color:"#3ec5ff", size:150,
   lines:["A small kitchen, loud music, slow mornings.","Wherever we land — we build the whole world there."]},
  {id:"moon", emoji:"🌙", name:"Our Moon", color:"#e6e6f0", size:118,
   lines:["Same moon, two windows, one heart.","Look up tonight — I'll be looking too."]},
  {id:"music", emoji:"🎵", name:"Planet Melody", color:"#d946ef", size:96,
   lines:["Our song still plays when the sky goes quiet.","Some notes only sound right next to you."]},
  {id:"dream", emoji:"🌠", name:"Planet Dreams", color:"#6f7bff", size:110,
   lines:["I keep meeting you in places we haven't been yet.","Sleep well — I'll save you a seat in mine."]},
  {id:"adventure", emoji:"🚀", name:"Planet Adventure", color:"#ff8a3d", size:100,
   lines:["Pick a coordinate, any coordinate — I'm already packed.","The map only makes sense with two names on it."]},
  {id:"home", emoji:"🏡", name:"Planet Home", color:"#57c98a", size:112,
   lines:["Home was never a place. It was the sound of you arriving.","Door's always open on this one."]},
  {id:"forever", emoji:"💫", name:"Planet Forever", color:"#c77dff", size:122,
   lines:["Stars burn out. This doesn't.","However long forever is — add one more day."]},
  {id:"stars", emoji:"✨", name:"Planet Stardust", color:"#ffe08a", size:92,
   lines:["We're made of the same leftover light.","Every wish I threw up here had your name on it."]},
  {id:"secret", emoji:"💖", name:"Secret Planet", color:"#ff6fae", size:132, secret:true,
   lines:["The hidden planet only you could reach.","Forever, in every universe. Yours — Mustafaki."]}
];

const TOTAL = PLANETS.filter(p => !p.secret).length;
const visited = new Set();
document.getElementById("total").textContent = "/" + TOTAL;

/* stars */
const starLayer = document.getElementById("stars");
for (let i = 0; i < 110; i++) {
  const s = document.createElement("span");
  s.className = "star";
  const size = 1.5 + Math.random() * 2;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${Math.random()*3}s`;
  starLayer.appendChild(s);
}

/* hearts */
const glyphs = ["💖","💫","❤️","✨","💕","🌟"];
const heartLayer = document.getElementById("hearts");
for (let i = 0; i < 16; i++) {
  const h = document.createElement("span");
  h.className = "heart";
  h.textContent = glyphs[i % glyphs.length];
  h.style.cssText = `left:${Math.random()*96}%;font-size:${18+Math.random()*16}px;animation-duration:${9+Math.random()*5}s;animation-delay:${Math.random()*11}s`;
  heartLayer.appendChild(h);
}

/* planets */
const space = document.getElementById("space");
function render() {
  space.innerHTML = "";
  PLANETS.forEach((p, i) => {
    if (p.secret && visited.size < TOTAL) return;
    const btn = document.createElement("button");
    btn.className = "planet";
    btn.setAttribute("aria-label", p.name);
    btn.style.animationDelay = (i * 0.3) + "s";
    btn.innerHTML = `
      <span class="halo" style="background:${p.color}"></span>
      <span class="ball" style="width:${p.size}px;height:${p.size}px;background:radial-gradient(circle at 32% 28%, #fff8, ${p.color} 62%, #0006)">${p.emoji}</span>
      <span class="name">${p.name}</span>
      ${visited.has(p.id) ? '<span class="tick">✧</span>' : ""}`;
    btn.onclick = () => openBox(p);
    space.appendChild(btn);
  });
}

function openBox(p) {
  visited.add(p.id);
  document.getElementById("count").textContent = [...visited].filter(id => id !== "secret").length;
  document.getElementById("secretNote").textContent = visited.size >= TOTAL ? " · secret revealed 💖" : "";
  document.getElementById("boxIcon").textContent = p.emoji;
  document.getElementById("boxIcon").style.background = p.color;
  document.getElementById("boxTitle").textContent = p.name;
  document.getElementById("boxText").innerHTML = p.lines.map(l => `<p>${l}</p>`).join("");
  document.getElementById("overlay").classList.add("show");
  render();
}

function closeBox() {
  document.getElementById("overlay").classList.remove("show");
}

document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") closeBox();
});
document.addEventListener("keydown", e => e.key === "Escape" && closeBox());

render();
</script>
</body>
</html>
